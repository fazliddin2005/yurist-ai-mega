name: Deploy notification

on:
  deployment_status:

jobs:
  notify:
    name: Vercel deploy natijasi
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure'

    steps:
      - name: Telegram xabar
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Telegram sozlanmagan, o'tkazib yuboriladi"
            exit 0
          fi

          STATE="${{ github.event.deployment_status.state }}"
          ENV="${{ github.event.deployment_status.environment }}"
          URL="${{ github.event.deployment_status.target_url }}"

          if [ "$STATE" = "success" ]; then
            ICON="✅"
            MSG="Muvaffaqiyatli deploy"
          else
            ICON="❌"
            MSG="Deploy muvaffaqiyatsiz"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${ICON} Yurist AI ${MSG}%0AEnvironment: ${ENV}%0AURL: ${URL}"
